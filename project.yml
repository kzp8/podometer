name: AuraSteps
options:
  bundleIdPrefix: com.aurasteps
  deploymentTarget:
    iOS: 16.0
  developmentLanguage: es

targets:
  AuraSteps:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - AuraSteps/AuraStepsApp.swift
      - AuraSteps/DashboardView.swift
      - AuraSteps/ConnectionsView.swift
      - AuraSteps/SettingsView.swift
      - AuraSteps/StepMotionManager.swift
      - AuraSteps/DeepLinkManager.swift
      - AuraSteps/WebhookDispatcher.swift
      - AuraSteps/UserSettingsManager.swift
      - AuraSteps/ThemeManager.swift
      - AuraSteps/WelcomeOnboardingView.swift
      - AuraSteps/NotificationManager.swift
      - AuraSteps/AchievementsManager.swift
      - AuraSteps/Assets.xcassets
    info:
      path: AuraSteps/Info.plist
      properties:
        NSMotionUsageDescription: "AuraSteps requiere acceso al coprocesador de movimiento para contar tus pasos, medir la distancia recorrida y calcular las calorías activas en tiempo real."
        NSHealthShareUsageDescription: "AuraSteps lee los datos de lectura de pasos y actividad de HealthKit para consolidar tu historial diario y semanal de forma 100% local."
        NSHealthUpdateUsageDescription: "AuraSteps requiere acceso a HealthKit para sincronizar pasivamente tus métricas de actividad."
        NSCameraUsageDescription: "AuraSteps utiliza la cámara exclusivamente para escaneo voluntario de códigos QR de vinculación a gimnasios o servidores de terceros."
        UILaunchScreen: {}
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.aurasteps.app
      SWIFT_VERSION: "5.0"
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "YES"
      ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGN_ENTITLEMENTS: "Entitlements.plist"
      INFOPLIST_KEY_NSMotionUsageDescription: "AuraSteps requiere acceso al coprocesador de movimiento para contar tus pasos, medir la distancia recorrida y calcular las calorías activas en tiempo real."
      INFOPLIST_KEY_NSHealthShareUsageDescription: "AuraSteps lee los datos de lectura de pasos y actividad de HealthKit para consolidar tu historial diario y semanal de forma 100% local."
      INFOPLIST_KEY_NSHealthUpdateUsageDescription: "AuraSteps requiere acceso a HealthKit para sincronizar pasivamente tus métricas de actividad."
      INFOPLIST_KEY_NSCameraUsageDescription: "AuraSteps utiliza la cámara exclusivamente para escaneo voluntario de códigos QR de vinculación a gimnasios o servidores de terceros."
