name: AuraSteps
options:
  bundleIdPrefix: com.aurasteps
  deploymentTarget:
    iOS: 16.0
  developmentLanguage: es

targets:
  AuraSteps:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - AuraSteps/AuraStepsApp.swift
      - AuraSteps/DashboardView.swift
      - AuraSteps/ConnectionsView.swift
      - AuraSteps/StepMotionManager.swift
      - AuraSteps/DeepLinkManager.swift
      - AuraSteps/WebhookDispatcher.swift
    info:
      path: AuraSteps/Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.aurasteps.app
      SWIFT_VERSION: "5.0"
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "YES"
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGN_ENTITLEMENTS: "Entitlements.plist"
