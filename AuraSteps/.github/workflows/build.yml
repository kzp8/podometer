name: Build AuraSteps IPA for TrollStore

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-trollstore-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          if [ -f "AuraSteps/project.yml" ]; then
            cd AuraSteps && xcodegen generate
          elif [ -f "project.yml" ]; then
            xcodegen generate
          fi

      - name: Find Xcode Project
        id: find_proj
        run: |
          PROJ_PATH=$(find . -name "AuraSteps.xcodeproj" -maxdepth 2 | head -n 1)
          echo "PROJ_PATH=$PROJ_PATH"
          PROJ_DIR=$(dirname "$PROJ_PATH")
          echo "PROJ_DIR=$PROJ_DIR" >> $GITHUB_ENV

      - name: Build Unsigned iOS App
        run: |
          cd ${{ env.PROJ_DIR }}
          xcodebuild build \
            -project AuraSteps.xcodeproj \
            -scheme AuraSteps \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA for TrollStore
        run: |
          cd ${{ env.PROJ_DIR }}
          APP_PATH=$(find build -name "AuraSteps.app" | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r AuraSteps_TrollStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraSteps_TrollStore_IPA
          path: "**/AuraSteps_TrollStore.ipa"
