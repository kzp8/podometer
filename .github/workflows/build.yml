name: Build AuraSteps IPA for TrollStore

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-trollstore-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          if [ -f "project.yml" ]; then
            xcodegen generate
          elif [ -f "AuraSteps/project.yml" ]; then
            cd AuraSteps && xcodegen generate
          fi

      - name: Build Unsigned iOS App
        run: |
          PROJ=$(find . -name "AuraSteps.xcodeproj" | head -n 1)
          PROJ_DIR=$(dirname "$PROJ")
          cd "$PROJ_DIR"
          xcodebuild build \
            -project AuraSteps.xcodeproj \
            -scheme AuraSteps \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA for TrollStore
        run: |
          PROJ=$(find . -name "AuraSteps.xcodeproj" | head -n 1)
          PROJ_DIR=$(dirname "$PROJ")
          cd "$PROJ_DIR"
          APP_PATH=$(find build -name "AuraSteps.app" | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r AuraSteps_TrollStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraSteps_TrollStore_IPA
          path: "**/AuraSteps_TrollStore.ipa"
