name: Build AuraSteps IPA for TrollStore

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-trollstore-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned iOS App
        run: |
          xcodebuild build \
            -project AuraSteps.xcodeproj \
            -scheme AuraSteps \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA for TrollStore
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/AuraSteps.app Payload/
          zip -r AuraSteps_TrollStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraSteps_TrollStore_IPA
          path: AuraSteps_TrollStore.ipa
